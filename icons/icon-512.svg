<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="liveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0b0e14" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#grad)" opacity="0.15" />
  <!-- Radio Waves -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="url(#grad)" stroke-width="14" stroke-dasharray="16 16" opacity="0.4" />
  <circle cx="256" cy="270" r="110" fill="none" stroke="url(#grad)" stroke-width="16" opacity="0.7" />
  <circle cx="256" cy="270" r="60" fill="none" stroke="url(#grad)" stroke-width="18" opacity="0.9" />
  <!-- Central Pulse Center -->
  <circle cx="256" cy="270" r="28" fill="#ffffff" />
  <!-- Live Signal Badge -->
  <circle cx="390" cy="120" r="32" fill="url(#liveGlow)" />
  <circle cx="390" cy="120" r="14" fill="#ef4444" />
</svg>
